<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join India – Live Counter</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdf4",
                100: "#dcfce7",
                200: "#bbf7d0",
                300: "#86efac",
                400: "#4ade80",
                500: "#22c55e",
                600: "#16a34a",
                700: "#15803d",
                800: "#166534",
                900: "#14532d",
              },
            },
          },
        },
      };
    </script>

    <style>
      html, body {
        background: #ffffff;
        color: #0b0f0e;
        overflow-x: hidden;
      }

      .map-container {
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      .map-image {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 20px 40px rgba(22, 163, 74, 0.25));
      }

      .marker {
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #16a34a;
        border: 3px solid #ffffff;
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.5);
        cursor: pointer;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        color: #ffffff;
        font-size: 12px;
        user-select: none;
      }

      .marker:hover {
        background: #14532d;
        transform: translate(-50%, -50%) scale(1.15);
      }

      .marker-human {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      .counter-card {
        background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
        border: 2px solid #16a34a;
        box-shadow: 0 20px 50px rgba(22, 163, 74, 0.25);
      }

      .input-field {
        background: #ffffff;
        border: 2px solid #bbf7d0;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .input-field:focus {
        outline: none;
        border-color: #16a34a;
        box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15);
      }

      .btn-primary {
        background: linear-gradient(135deg, #16a34a 0%, #14532d 100%);
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0.02em;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        box-shadow: 0 15px 35px rgba(22, 163, 74, 0.35);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
        box-shadow: 0 20px 45px rgba(22, 163, 74, 0.45);
      }

      .section-title {
        background: linear-gradient(90deg, #14532d, #16a34a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Subtle animated background blobs */
      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        z-index: -1;
      }
    </style>
  </head>
  <body class="min-h-screen relative">
    <!-- Animated background blobs -->
    <div class="bg-blob bg-brand-300 w-72 h-72 top-0 left-0"></div>
    <div class="bg-blob bg-brand-200 w-80 h-80 bottom-0 right-0"></div>
    <div class="bg-blob bg-brand-400 w-64 h-64 top-1/3 right-1/4"></div>

    <!-- Main content -->
    <main class="relative z-10">
      <!-- Header -->
      <header class="pt-12 pb-8 px-6 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold section-title tracking-tight">
          Join The India Movement
        </h1>
        <p class="mt-4 text-base md:text-lg text-brand-800 max-w-2xl mx-auto">
          Add your name to the map and see how many people have already joined. Clean, fast, and aggressively green.
        </p>
      </header>

      <!-- Counter Card -->
      <section class="px-6">
        <div class="counter-card rounded-2xl p-6 md:p-8 max-w-3xl mx-auto">
          <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-brand-900">
                Total Joined
              </h2>
              <p class="text-brand-700 mt-1">
                Real-time count of people who’ve added their name.
              </p>
            </div>
            <div class="text-center">
              <div id="counter" class="text-5xl md:text-6xl font-black text-brand-600">
                0
              </div>
              <div class="text-sm text-brand-700 mt-1">people</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Map Section -->
      <section class="px-6 mt-10">
        <div class="map-container">
          <!-- India map image (using a publicly available SVG map) -->
          <img
            id="indiaMap"
            class="map-image"
            src="https://i.pinimg.com/736x/f6/5a/11/f65a1163bc39bd55ead249090913d672.jpg"
            alt="Map of India"
          />

          <!-- Markers will be injected here via JS -->
          <div id="markersLayer" class="absolute inset-0"></div>
        </div>
      </section>

      <!-- Join Form -->
      <section class="px-6 mt-12 mb-16">
        <div class="max-w-xl mx-auto">
          <h3 class="text-2xl md:text-3xl font-extrabold text-brand-900 text-center">
            Add Your Name
          </h3>
          <p class="text-brand-700 text-center mt-2">
            Enter your name and claim your spot on the map.
          </p>

          <form id="joinForm" class="mt-6 space-y-4">
            <div>
              <label for="nameInput" class="block text-sm font-bold text-brand-900 mb-1">
                Your Name
              </label>
              <input
                id="nameInput"
                name="name"
                type="text"
                required
                placeholder="e.g. Aarav Sharma"
                class="input-field w-full rounded-xl px-4 py-3 text-brand-900 placeholder-brand-300"
              />
            </div>

            <button
              type="submit"
              class="btn-primary w-full rounded-xl px-6 py-3 text-lg"
            >
              Join Now
            </button>
          </form>

          <p id="formMessage" class="mt-3 text-center text-sm font-semibold"></p>
        </div>
      </section>
    </main>

    <script>
      // -------------------------
      // Basic state & localStorage
      // -------------------------
      const STORAGE_KEY = "india_join_counter_v1";
      const MARKERS_KEY = "india_join_markers_v1";

      function getCount() {
        const val = localStorage.getItem(STORAGE_KEY);
        return val ? parseInt(val, 10) : 0;
      }

      function setCount(n) {
        localStorage.setItem(STORAGE_KEY, String(n));
      }

      function getMarkers() {
        const val = localStorage.getItem(MARKERS_KEY);
        return val ? JSON.parse(val) : [];
      }

      function setMarkers(arr) {
        localStorage.setItem(MARKERS_KEY, JSON.stringify(arr));
      }

      // -------------------------
      // Counter logic
      // -------------------------
      const counterEl = document.getElementById("counter");

      function updateCounterDisplay(n) {
        counterEl.textContent = n;
      }

      function incrementCounter() {
        let n = getCount();
        n += 1;
        setCount(n);
        updateCounterDisplay(n);
        animateCounter(n);
      }

      function animateCounter(finalValue) {
        const start = parseInt(counterEl.textContent || "0", 10);
        gsap.fromTo(
          counterEl,
          { innerText: start },
          {
            innerText: finalValue,
            duration: 0.8,
            ease: "power2.out",
            snap: { innerText: 1 },
            onUpdate: function () {
              counterEl.innerText = Math.round(this.targets()[0].innerText);
            },
          }
        );
      }

      // -------------------------
      // Markers on map
      // -------------------------
      const markersLayer = document.getElementById("markersLayer");

      // Predefined approximate positions (top/left in %) for demo markers
      // In a real app, you’d map coordinates or let users click on the map.
      const defaultMarkerPositions = [
        { top: "28%", left: "45%" },   // North
        { top: "45%", left: "55%" },   // Central
        { top: "60%", left: "70%" },   // East
        { top: "55%", left: "30%" },   // West
        { top: "75%", left: "50%" },   // South
      ];

      function createMarkerElement(index, pos) {
        const marker = document.createElement("div");
        marker.className = "marker marker-human";
        marker.style.top = pos.top;
        marker.style.left = pos.left;
        marker.textContent = "🧑";
        marker.title = `Person #${index + 1}`;
        markersLayer.appendChild(marker);
        return marker;
      }

      function renderMarkers() {
        markersLayer.innerHTML = "";
        const markers = getMarkers();

        if (markers.length === 0) {
          // Show some default demo markers
          defaultMarkerPositions.forEach((pos, i) => {
            const m = createMarkerElement(i, pos);
            animateMarkerEntrance(m, i);
          });
          return;
        }

        markers.forEach((pos, i) => {
          const m = createMarkerElement(i, pos);
          animateMarkerEntrance(m, i);
        });
      }

      function animateMarkerEntrance(el, delayIndex = 0) {
        gsap.from(el, {
          scale: 0,
          opacity: 0,
          duration: 0.6,
          delay: delayIndex * 0.08,
          ease: "back.out(1.7)",
        });
      }

      // -------------------------
      // Form handling
      // -------------------------
      const joinForm = document.getElementById("joinForm");
      const nameInput = document.getElementById("nameInput");
      const formMessage = document.getElementById("formMessage");

      joinForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          formMessage.textContent = "Please enter your name.";
          formMessage.className = "mt-3 text-center text-sm font-semibold text-red-600";
          return;
        }

        // Increment counter
        incrementCounter();

        // Add a new marker at a semi-random position
        const markers = getMarkers();
        const pos =
          markers.length < defaultMarkerPositions.length
            ? defaultMarkerPositions[markers.length]
            : {
                top: (30 + Math.random() * 45) + "%",
                left: (25 + Math.random() * 50) + "%",
              };

        markers.push(pos);
        setMarkers(markers);

        // Re-render markers
        renderMarkers();

        // Show success message
        formMessage.textContent = `Welcome, ${name}! You’re on the map.`;
        formMessage.className = "mt-3 text-center text-sm font-semibold text-brand-700";

        // Clear input
        nameInput.value = "";

        // Animate the last marker a bit more
        const allMarkers = markersLayer.querySelectorAll(".marker");
        if (allMarkers.length) {
          const last = allMarkers[allMarkers.length - 1];
          gsap.fromTo(
            last,
            { scale: 0.6, rotation: -15 },
            { scale: 1, rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }
          );
        }
      });

      // -------------------------
      // Initial load
      // -------------------------
      function init() {
        const count = getCount();
        updateCounterDisplay(count);

        // Animate counter on load
        if (count > 0) {
          gsap.from(counterEl, {
            scale: 0.8,
            opacity: 0,
            duration: 0.7,
            ease: "back.out(1.4)",
          });
        }

        renderMarkers();

        // Subtle entrance animations for sections
        gsap.from("header h1", {
          y: 30,
          opacity: 0,
          duration: 0.8,
          ease: "power3.out",
        });
        gsap.from("header p", {
          y: 20,
          opacity: 0,
          duration: 0.8,
          delay: 0.15,
          ease: "power3.out",
        });
        gsap.from(".counter-card", {
          y: 40,
          opacity: 0,
          duration: 0.9,
          delay: 0.25,
          ease: "power3.out",
        });
        gsap.from(".map-container", {
          y: 50,
          opacity: 0,
          duration: 1,
          delay: 0.35,
          ease: "power3.out",
        });
        gsap.from("#joinForm", {
          y: 30,
          opacity: 0,
          duration: 0.8,
          delay: 0.45,
          ease: "power3.out",
        });
      }

      init();
    </script>
  </body>
</html>
